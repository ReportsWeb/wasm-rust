<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="t d"><title id="t">WASM言語ラッパーの全体構成</title><desc id="d">業務アプリが言語別ラッパーでPREPEJを作り、ブラウザまたはサーバーの共通WASM帳票エンジンへ渡す流れ</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#103f4c"/><stop offset="1" stop-color="#176d70"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".18"/></filter><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#e2ad39"/></marker></defs><rect width="1120" height="520" rx="24" fill="url(#bg)"/><text x="56" y="62" fill="#fff" font-family="Yu Gothic,Meiryo,sans-serif" font-size="28" font-weight="700">いつもの言語でデータを作り、描画は共通WASMへ。</text><text x="56" y="96" fill="#d7eef0" font-family="Yu Gothic,Meiryo,sans-serif" font-size="16">薄いラッパーは描画処理を持たず、持ち運べる印刷データ PREPEJ を組み立てます。</text><g filter="url(#s)" font-family="Yu Gothic,Meiryo,sans-serif"><rect x="56" y="142" width="260" height="280" rx="18" fill="#fff"/><text x="84" y="184" fill="#176d70" font-size="15" font-weight="700">YOUR APPLICATION</text><text x="84" y="221" fill="#173842" font-size="23" font-weight="700">業務アプリ</text><text x="84" y="255" fill="#4f6870" font-size="15">DB・API・業務ロジック</text><rect x="82" y="286" width="208" height="92" rx="13" fill="#eaf5f3"/><text x="100" y="319" fill="#176d70" font-size="16" font-weight="700">WASM言語ラッパー</text><text x="100" y="347" fill="#405d65" font-size="14">PrintData API</text><text x="100" y="369" fill="#405d65" font-size="14">座標・PDF描画は持たない</text><rect x="416" y="210" width="246" height="144" rx="72" fill="#fff8df" stroke="#e2ad39" stroke-width="3"/><text x="539" y="264" text-anchor="middle" fill="#7c5b0b" font-size="17" font-weight="700">PREPEJ</text><text x="539" y="294" text-anchor="middle" fill="#173842" font-size="20" font-weight="700">印刷データ</text><text x="539" y="321" text-anchor="middle" fill="#52666b" font-size="13">JSON・保存・HTTP・メール添付</text><rect x="760" y="142" width="304" height="280" rx="18" fill="#fff"/><text x="790" y="184" fill="#176d70" font-size="15" font-weight="700">ONE ENGINE, TWO ROUTES</text><text x="790" y="221" fill="#173842" font-size="23" font-weight="700">共通WASM帳票エンジン</text><rect x="788" y="254" width="248" height="62" rx="12" fill="#e9f4fb"/><text x="912" y="280" text-anchor="middle" fill="#176385" font-size="16" font-weight="700">ブラウザ内で生成</text><text x="912" y="302" text-anchor="middle" fill="#52666b" font-size="13">SVGプレビュー・PDF・印刷</text><rect x="788" y="332" width="248" height="62" rx="12" fill="#f1edf9"/><text x="912" y="358" text-anchor="middle" fill="#66518c" font-size="16" font-weight="700">サーバーで生成</text><text x="912" y="380" text-anchor="middle" fill="#52666b" font-size="13">PDF・定期処理・配信</text></g><path d="M316 282H408" stroke="#e2ad39" stroke-width="5" marker-end="url(#a)"/><path d="M662 282H752" stroke="#e2ad39" stroke-width="5" marker-end="url(#a)"/><text x="362" y="268" text-anchor="middle" fill="#fff" font-family="Yu Gothic,Meiryo,sans-serif" font-size="13">組み立てる</text><text x="707" y="268" text-anchor="middle" fill="#fff" font-family="Yu Gothic,Meiryo,sans-serif" font-size="13">渡す</text><text x="560" y="474" text-anchor="middle" fill="#d7eef0" font-family="Yu Gothic,Meiryo,sans-serif" font-size="14">PHP · Java · TypeScript / Node.js · C# / .NET · Rust · Go · Ruby ─ 同じPREPEJで同じ結果へ</text></svg>